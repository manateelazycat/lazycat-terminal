[general]
theme=default
opacity=0.88
font=Hack
font_size=13
line_height=1.0
settings_scroll_speed=1.00
hide_tab_bar=false
start_maximized=false
start_fullscreen=false
background_image=

[shortcut]
fullscreen=F11
copy=Ctrl + Shift + c
paste=Ctrl + Shift + v
search=Ctrl + Shift + f
zoom_in=Ctrl + =
zoom_out=Ctrl + -
default_size=Ctrl + 0
select_all=Ctrl + Shift + a
new_workspace=Ctrl + Shift + t
close_workspace=Ctrl + Shift + w
next_workspace=Ctrl + Tab
previous_workspace=Ctrl + Shift + Tab
switch_to_workspace_1=Alt + 1
switch_to_workspace_2=Alt + 2
switch_to_workspace_3=Alt + 3
switch_to_workspace_4=Alt + 4
switch_to_workspace_5=Alt + 5
switch_to_workspace_6=Alt + 6
switch_to_workspace_7=Alt + 7
switch_to_workspace_8=Alt + 8
switch_to_workspace_9=Alt + 9
switch_to_last_workspace=Alt + 0
move_workspace_to_first=Ctrl + Shift + Home
move_workspace_left=Ctrl + Shift + Page_Up
move_workspace_right=Ctrl + Shift + Page_Down
move_workspace_to_end=Ctrl + Shift + End
vertical_split=Ctrl + Shift + j
horizontal_split=Ctrl + Shift + h
select_upper_window=Alt + k
select_lower_window=Alt + j
select_left_window=Alt + h
select_right_window=Alt + l
close_window=Ctrl + Alt + q
close_other_windows=Ctrl + Shift + q
copy_last_output=Ctrl + Alt + c
switch_background=Ctrl + Shift + b
